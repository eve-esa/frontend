# Manual dispatch only: there is no automatic trigger into production.
# The --ref you dispatch with must be a v* tag, not a branch.
# One approval is required (the esa-eve-prod environment gate).
# This never builds: it republishes the tarball staging attached to the Release.
name: "promote: prod"
run-name: promote prod ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote (e.g. 1.0.0 or v1.0.0)
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: esa-eve-prod
    permissions:
      id-token: write
      contents: read
    outputs:
      commit-sha: ${{ steps.metadata.outputs.commit-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          # Normalize version (remove leading 'v' if present)
          VERSION="${VERSION#v}"

          # Ensure the release exists AND carries the bundle. Checking only that the release exists
          # used to be a proxy for "staging has run", because staging was what created it. Since
          # release-please creates the release the moment its pull request merges, that proxy no
          # longer holds: the release can exist while staging never promoted. Assert the asset,
          # which is the thing production actually consumes.
          ASSET_NAME="eve-frontend-${VERSION}-dist.tar.gz"
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: release v${VERSION} not found."
            exit 1
          fi
          if ! gh release view "v${VERSION}" --json assets --jq '.assets[].name' | grep -qx "$ASSET_NAME"; then
            echo "ERROR: release v${VERSION} exists but carries no ${ASSET_NAME}."
            echo "Production re-publishes the bundle staging built; it never builds its own."
            echo "Promote v${VERSION} to staging first, then run this again."
            exit 1
          fi

          # Resolve commit SHA from the tag (dereference annotated tags to commits)
          COMMIT_SHA=$(git rev-list -n 1 "v${VERSION}" 2>/dev/null || echo "")

          if [ -z "$COMMIT_SHA" ]; then
            # Fallback if not a tag or git fails (e.g., shallow clone)
            echo "Warning: Could not resolve tag via git rev-list, using gh api"
            COMMIT_SHA=$(gh api repos/${{ github.repository }}/git/refs/tags/v${VERSION} --jq '.object.sha')
          fi

          echo "commit-sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Promoting version: v${VERSION}"
          echo "Commit SHA: ${COMMIT_SHA}"

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ASSET_NAME="eve-frontend-${VERSION}-dist.tar.gz"

          echo "Downloading asset: ${ASSET_NAME}"
          gh release download "v${VERSION}" \
            -p "${ASSET_NAME}" \
            -D .

          tar xzf "${ASSET_NAME}"
          ls -la dist/

      # The release stage: one build is promoted unchanged across environments, so anything
      # that differs between them is combined with the artifact here rather than baked in.
      # An undefined variable expands to the empty string, which the app treats as absent and
      # falls back to the code's default: ON for the four original flags, OFF for the six
      # opening-scope flags.
      - name: Inject runtime config
        uses: ./.github/actions/inject-runtime-config
        with:
          config-json: |
            {
              "FEATURE_MODEL_PICKER": "${{ vars.FEATURE_MODEL_PICKER }}",
              "FEATURE_CUSTOM_MODELS": "${{ vars.FEATURE_CUSTOM_MODELS }}",
              "FEATURE_STREAMING": "${{ vars.FEATURE_STREAMING }}",
              "FEATURE_CLASSIFICATION_FILTERS": "${{ vars.FEATURE_CLASSIFICATION_FILTERS }}",
              "FEATURE_ARTIFACTS": "${{ vars.FEATURE_ARTIFACTS }}",
              "FEATURE_TOOLKITS": "${{ vars.FEATURE_TOOLKITS }}",
              "FEATURE_PRIVATE_COLLECTIONS": "${{ vars.FEATURE_PRIVATE_COLLECTIONS }}",
              "FEATURE_ATTACHMENTS": "${{ vars.FEATURE_ATTACHMENTS }}",
              "FEATURE_ANSWERED_BY": "${{ vars.FEATURE_ANSWERED_BY }}",
              "FEATURE_BETA_BADGE": "${{ vars.FEATURE_BETA_BADGE }}",
              "CONTACT_URL": "${{ vars.VITE_CONTACT_URL }}",
              "PRIVACY_POLICY_URL": "${{ vars.VITE_PRIVACY_POLICY_URL }}",
              "ABOUT_US_URL": "${{ vars.VITE_ABOUT_US_URL }}",
              "AUTH_ISSUER": "${{ vars.AUTH_ISSUER }}",
              "AUTH_CLIENT_ID": "${{ vars.AUTH_CLIENT_ID }}",
              "AUTH_SCOPE": "${{ vars.AUTH_SCOPE }}"
            }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload to S3
        run: |
          COMMIT_SHA="${{ steps.metadata.outputs.commit-sha }}"
          RELEASE_PATH="releases/${COMMIT_SHA}"

          echo "Uploading to s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"
          aws s3 cp --recursive dist/ "s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"

          echo "Upload complete"

      # Same job as the upload on purpose: an Environment gate fires once per job, so promoting to
      # production used to ask the reviewer to approve the same decision twice.
      - name: Flip release pointer
        uses: ./.github/actions/flip-release
        with:
          release-sha: ${{ steps.metadata.outputs.commit-sha }}
          public-url: ${{ vars.PUBLIC_URL }}
          kvs-arn: ${{ vars.RELEASE_KVS_ARN }}
