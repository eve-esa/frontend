name: promote staging
run-name: promote staging ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  release-build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit-sha: ${{ steps.metadata.outputs.commit-sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Extract metadata
        id: metadata
        env:
          TAG_REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Extract commit SHA from tag
          COMMIT_SHA=$(git rev-list -n 1 "$TAG_REF")
          echo "commit-sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          # Extract version from tag ref (e.g. refs/tags/v1.0.0 -> 1.0.0)
          VERSION="$TAG_NAME"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "Releasing version: ${VERSION}"
          echo "Commit SHA: ${COMMIT_SHA}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          VITE_API_URL: /api
          # Shown in the login page footer. This is the only place where the
          # release version and commit are baked into the bundle: promote-prod
          # downloads and re-publishes this very same tarball from the GitHub
          # release instead of rebuilding, so prod inherits these values and is
          # guaranteed to display exactly what staging displayed.
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_APP_COMMIT: ${{ steps.metadata.outputs.commit-sha }}

      - name: Create distribution tarball
        run: |
          tar czf eve-frontend-${{ steps.metadata.outputs.version }}-dist.tar.gz dist/
          ls -lh eve-frontend-${{ steps.metadata.outputs.version }}-dist.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"

          # Check if release exists
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists, uploading asset"
            gh release upload "v${VERSION}" \
              eve-frontend-${VERSION}-dist.tar.gz \
              --clobber
          else
            echo "Creating release v${VERSION}"
            gh release create "v${VERSION}" \
              eve-frontend-${VERSION}-dist.tar.gz \
              --title "Frontend v${VERSION}" \
              --generate-notes
          fi

  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    needs: release-build
    environment: esa-eve-staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          ASSET_NAME="eve-frontend-${VERSION}-dist.tar.gz"

          echo "Downloading asset: ${ASSET_NAME}"
          gh release download "v${VERSION}" \
            -p "${ASSET_NAME}" \
            -D .

          tar xzf "${ASSET_NAME}"
          ls -la dist/

      # The release stage: one build is promoted unchanged across environments, so anything
      # that differs between them is combined with the artifact here rather than baked in.
      # An undefined variable expands to the empty string, which the app treats as absent and
      # falls back to the code's default -- it does not read as "off".
      - name: Inject runtime config
        uses: ./.github/actions/inject-runtime-config
        with:
          config-json: |
            {
              "FEATURE_MODEL_PICKER": "${{ vars.FEATURE_MODEL_PICKER }}",
              "FEATURE_CUSTOM_MODELS": "${{ vars.FEATURE_CUSTOM_MODELS }}",
              "FEATURE_STREAMING": "${{ vars.FEATURE_STREAMING }}",
              "FEATURE_CLASSIFICATION_FILTERS": "${{ vars.FEATURE_CLASSIFICATION_FILTERS }}",
              "FEATURE_SELF_SIGNUP": "${{ vars.FEATURE_SELF_SIGNUP }}"
            }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload to S3
        run: |
          COMMIT_SHA="${{ needs.release-build.outputs.commit-sha }}"
          RELEASE_PATH="releases/${COMMIT_SHA}"

          echo "Uploading to s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"
          aws s3 cp --recursive dist/ "s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"

          echo "Upload complete"

      # Same job as the upload on purpose: an Environment gate fires once per job, so promoting to
      # production used to ask the reviewer to approve the same decision twice.
      - name: Flip release pointer
        uses: ./.github/actions/flip-release
        with:
          release-sha: ${{ needs.release-build.outputs.commit-sha }}
          public-url: ${{ vars.PUBLIC_URL }}
          kvs-arn: ${{ vars.RELEASE_KVS_ARN }}
