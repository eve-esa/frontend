server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets never change under the same name — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: let client-side routing handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
