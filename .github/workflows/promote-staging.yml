name: promote staging
run-name: promote staging ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  release-build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit-sha: ${{ steps.metadata.outputs.commit-sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Extract metadata
        id: metadata
        env:
          TAG_REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Extract commit SHA from tag
          COMMIT_SHA=$(git rev-list -n 1 "$TAG_REF")
          echo "commit-sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          # Extract version from tag ref (e.g. refs/tags/v1.0.0 -> 1.0.0)
          VERSION="$TAG_NAME"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "Releasing version: ${VERSION}"
          echo "Commit SHA: ${COMMIT_SHA}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          VITE_API_URL: /api

      - name: Create distribution tarball
        run: |
          tar czf eve-frontend-${{ steps.metadata.outputs.version }}-dist.tar.gz dist/
          ls -lh eve-frontend-${{ steps.metadata.outputs.version }}-dist.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"

          # Check if release exists
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists, uploading asset"
            gh release upload "v${VERSION}" \
              eve-frontend-${VERSION}-dist.tar.gz \
              --clobber
          else
            echo "Creating release v${VERSION}"
            gh release create "v${VERSION}" \
              eve-frontend-${VERSION}-dist.tar.gz \
              --title "Frontend v${VERSION}" \
              --generate-notes
          fi

  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    needs: release-build
    environment: esa-eve-staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          ASSET_NAME="eve-frontend-${VERSION}-dist.tar.gz"

          echo "Downloading asset: ${ASSET_NAME}"
          gh release download "v${VERSION}" \
            -p "${ASSET_NAME}" \
            -D .

          tar xzf "${ASSET_NAME}"
          ls -la dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload to S3
        run: |
          COMMIT_SHA="${{ needs.release-build.outputs.commit-sha }}"
          RELEASE_PATH="releases/${COMMIT_SHA}"

          echo "Uploading to s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"
          aws s3 cp --recursive dist/ "s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"

          echo "Upload complete"

  flip:
    name: Flip Release
    needs: [release-build, publish]
    # The called workflow's job requests id-token; a caller job must grant at least that.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/flip-release.yml
    with:
      environment: staging
      release-sha: ${{ needs.release-build.outputs.commit-sha }}
    secrets: inherit
