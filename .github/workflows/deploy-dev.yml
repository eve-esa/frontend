name: deploy dev

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          VITE_API_URL: /api
          # Shown in the login page footer. Dev builds are not tagged, so there
          # is no release version to display: only the commit identifies them.
          VITE_APP_VERSION: dev
          VITE_APP_COMMIT: ${{ github.sha }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    needs: build
    environment: esa-eve-dev
    permissions:
      id-token: write
      contents: read
    steps:
      # A local composite action lives in the repository, so the workspace has to contain it.
      # Only this job needed adding: the two promotion workflows already check out, for the
      # release asset. Sparse, because nothing else here reads the source tree.
      - name: Checkout actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload to S3
        run: |
          RELEASE_SHA="${{ github.sha }}"
          RELEASE_PATH="releases/${RELEASE_SHA}"

          echo "Uploading to s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"
          aws s3 cp --recursive dist/ "s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"

          echo "Upload complete"

      # Same job as the upload on purpose: an Environment gate fires once per job, so promoting to
      # production used to ask the reviewer to approve the same decision twice.
      - name: Flip release pointer
        uses: ./.github/actions/flip-release
        with:
          release-sha: ${{ github.sha }}
          public-url: ${{ vars.PUBLIC_URL }}
          kvs-arn: ${{ vars.RELEASE_KVS_ARN }}
