# Browser end-to-end suite (e2e/) against dev after every successful dev deploy, and against
# staging on demand. Read-only for the repository: it only signs in with a test account of the
# target environment and reports. The prod-readonly project is never run from here.
#
# Staging runs from the release tag that was promoted, in the esa-eve-staging environment, whose
# branch policy accepts v* tags only:
#   gh workflow run "e2e: dev" -R eve-esa/frontend --ref vX.Y.Z -f target=staging
#
# eve-esa/backend calls this file through workflow_call after every successful backend dev
# deploy, so a backend-only merge also gets a dev run. A called workflow runs in the caller's
# repository and reads the caller's github context and esa-eve-dev environment, so the checkout
# below names this repository and takes main whenever the caller is not this repository, and
# the target is always dev there, whatever the caller passes.
name: "e2e: dev"
run-name: "e2e ${{ (github.repository != 'eve-esa/frontend' && 'dev') || inputs.target || 'dev' }}"

on:
  workflow_run:
    workflows: ["deploy: dev"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Project to run (dev, staging, local needs a reachable host); staging needs a v* tag as the ref"
        required: false
        default: dev
        type: choice
        options: [dev, staging]
  workflow_call:
    inputs:
      target:
        description: "Project to run (dev)"
        required: false
        default: dev
        type: string

concurrency:
  group: "e2e-${{ (github.repository != 'eve-esa/frontend' && 'dev') || inputs.target || 'dev' }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A job outside any environment, so a staging dispatch from a branch gets this message instead
  # of the environment's bare branch policy refusal.
  staging-ref:
    name: Staging ref is a release tag
    if: github.repository == 'eve-esa/frontend' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) echo "Running staging from $REF" ;;
            *)
              echo "::error::Staging runs from the promoted release tag, not $REF. Dispatch with: gh workflow run \"e2e: dev\" -R eve-esa/frontend --ref vX.Y.Z -f target=staging"
              exit 1
              ;;
          esac

  e2e:
    name: Playwright
    needs: staging-ref
    # staging-ref is skipped for dev, which must not skip this job.
    if: >-
      !cancelled() && needs.staging-ref.result != 'failure'
      && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: "${{ github.repository == 'eve-esa/frontend' && inputs.target == 'staging' && 'esa-eve-staging' || 'esa-eve-dev' }}"
    container:
      # Same Playwright version as the devDependency: the browsers ship in the image.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CI: "true"
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_PROJECT: "${{ (github.repository != 'eve-esa/frontend' && 'dev') || inputs.target || 'dev' }}"
    steps:
      - name: Check the test account secrets
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::E2E_EMAIL and E2E_PASSWORD are not set in the GitHub environment esa-eve-$E2E_PROJECT. Create both secrets for a test user of that environment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eve-esa/frontend
          # The commit dev just deployed, or the dispatched ref (the release tag for staging).
          # Called from another repository, that commit is not a frontend commit: dev serves main.
          ref: ${{ github.repository == 'eve-esa/frontend' && (github.event.workflow_run.head_sha || github.sha) || 'main' }}

      - name: Install dependencies
        run: |
          corepack enable
          corepack yarn install --frozen-lockfile

      - name: Run the suite
        run: corepack yarn e2e --project="$E2E_PROJECT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ env.E2E_PROJECT }}
          path: e2e/report
          retention-days: 14
