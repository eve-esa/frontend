# Browser end-to-end suite (e2e/) against dev after every successful dev deploy, and against
# staging after every successful staging promote. Read-only for the repository: it only signs in
# with a test account of the target environment and reports. The prod-readonly project is never
# run from here.
#
# The target is computed once per expression below: the dispatch input, else staging when the
# triggering run is "promote: staging", else dev. Each target reads its own GitHub environment:
# dev from esa-eve-dev; staging from esa-eve-staging-e2e, which holds only the test account,
# because esa-eve-staging accepts v* tags only and this workflow runs on main.
name: "e2e: dev"
run-name: "e2e ${{ inputs.target || (github.event.workflow_run.name == 'promote: staging' && 'staging') || 'dev' }}"

on:
  workflow_run:
    workflows: ["deploy: dev", "promote: staging"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Project to run (dev, staging, local needs a reachable host)"
        required: false
        default: dev
        type: choice
        options: [dev, staging]

concurrency:
  group: "e2e-${{ inputs.target || (github.event.workflow_run.name == 'promote: staging' && 'staging') || 'dev' }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: "${{ (inputs.target || (github.event.workflow_run.name == 'promote: staging' && 'staging') || 'dev') == 'staging' && 'esa-eve-staging-e2e' || 'esa-eve-dev' }}"
    container:
      # Same Playwright version as the devDependency: the browsers ship in the image.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CI: "true"
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_PROJECT: "${{ inputs.target || (github.event.workflow_run.name == 'promote: staging' && 'staging') || 'dev' }}"
    steps:
      - name: Check the test account secrets
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::E2E_EMAIL and E2E_PASSWORD are not set in the GitHub environment of the $E2E_PROJECT target. Create both secrets for a test user of that environment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the triggering run deployed or promoted, not the head of main at run time.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install dependencies
        run: |
          corepack enable
          corepack yarn install --frozen-lockfile

      - name: Run the suite
        run: corepack yarn e2e --project="$E2E_PROJECT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ env.E2E_PROJECT }}
          path: e2e/report
          retention-days: 14
