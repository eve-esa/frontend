name: CI

on:
  pull_request:
  # Also on main, so a merge that combines two individually green branches is still tested. The
  # release pull request is the exception: it is opened with GITHUB_TOKEN, which raises no workflow
  # runs, so nothing reports on it.
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .nvmrc, not a pinned 20: every deploy build uses node-version-file, so a
      # hardcoded version here means CI tests on a different Node major than the
      # one that ships.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Lint, type-check and build were not checked on a pull request, only the
      # unit tests. That is why 30 lint problems could stand on main, and why a
      # type error in a file no test imports first surfaced in deploy-dev, after
      # merge. `yarn build` is `tsc -b && vite build`, so it is the real gate:
      # type-check is kept separate because it names the failing file faster.
      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build
