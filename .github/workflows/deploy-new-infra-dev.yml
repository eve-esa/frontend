# Deploy frontend to new-infra dev (esa-eve-dev) via workflow_dispatch
# Legacy workflows (deploy-production.yml, deploy-staging.yml) remain untouched
name: Deploy to new-infra dev (esa-eve-dev)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: esa-eve-dev
      url: https://dev.eve-chat.chat
    concurrency:
      group: deploy-dev-frontend
      cancel-in-progress: false
    strategy:
      matrix:
        node-version: [22.16.0]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012298690756:role/esa-eve-dev-app-deploy
          role-session-name: github-action-${{ github.run_id }}
          aws-region: eu-west-1

      - run: yarn install --frozen-lockfile

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build
        run: CI=false NODE_OPTIONS=--max_old_space_size=4096 yarn build
        env:
          VITE_API_URL: /api

      - name: Deploy to S3
        run: aws s3 sync ./dist s3://esa-eve-dev-web-frontend --delete

      - name: CloudFront Cache Invalidation
        run: aws cloudfront create-invalidation --distribution-id E1YILCQ1MW37P5 --paths "/*"

      - name: Verify deployment
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://dev.eve-chat.chat | grep -q 200 && echo "Deployment verified" || exit 1

      - name: Summary
        if: always()
        run: |
          cat > $GITHUB_STEP_SUMMARY <<EOF
          ## Frontend Deployment to esa-eve-dev
          - **Status**: ${{ job.status }}
          - **Environment**: https://dev.eve-chat.chat
          - **Commit**: ${{ github.sha }}
          - **Short SHA**: ${{ env.SHORT_SHA }}
          EOF
