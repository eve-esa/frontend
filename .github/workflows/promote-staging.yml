# Staging promotion. The bundle is built from the tag, published as a GitHub Release asset, and
# uploaded to S3 behind the release pointer. Production later re-publishes that exact asset.
#
# Dispatch only, and it must be dispatched at the tag. release.yml fires it automatically after a
# release is cut; running it by hand is the break-glass path. The v* tag no longer triggers it on
# push: release-please owns the tags now, and a tag pushed by hand would both desync
# .release-please-manifest.json and promote whatever it happened to point at.
#
# --ref is not optional: the esa-eve-staging environment accepts only refs matching v*, so a
# dispatch defaulting to main is refused. Every step below reads inputs.version rather than the
# ref, so a run started at the wrong ref fails loudly instead of quietly building main and
# attaching it to a release tag.
name: promote staging
run-name: promote staging ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to promote, for example v0.0.7"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  release-build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit-sha: ${{ steps.metadata.outputs.commit-sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          # rev-list below needs the tag object, which a shallow clone does not carry.
          fetch-depth: 0

      - name: Extract metadata
        id: metadata
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Extract commit SHA from the tag
          COMMIT_SHA=$(git rev-list -n 1 "$VERSION_INPUT")
          echo "commit-sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          # The input is accepted as v1.0.0 or 1.0.0; downstream wants it bare.
          VERSION="${VERSION_INPUT#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          echo "Releasing version: ${VERSION}"
          echo "Commit SHA: ${COMMIT_SHA}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          VITE_API_URL: /api
          # Shown in the login page footer. This is the only place where the
          # release version and commit are baked into the bundle: promote-prod
          # downloads and re-publishes this very same tarball from the GitHub
          # release instead of rebuilding, so prod inherits these values and is
          # guaranteed to display exactly what staging displayed.
          VITE_APP_VERSION: ${{ inputs.version }}
          VITE_APP_COMMIT: ${{ steps.metadata.outputs.commit-sha }}

      - name: Create distribution tarball
        run: |
          tar czf eve-frontend-${{ steps.metadata.outputs.version }}-dist.tar.gz dist/
          ls -lh eve-frontend-${{ steps.metadata.outputs.version }}-dist.tar.gz

      # Attach only. release-please creates the release when its pull request is merged, so this
      # step no longer has a create branch: creating one here would mean the release either did not
      # exist or was made at the wrong ref, and gh release create without --target would have
      # silently anchored it to the default branch head. Failing is the correct answer.
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: no GitHub Release v${VERSION} to attach the bundle to."
            echo "Releases are created by merging the release pull request, not by this workflow."
            echo "If you are promoting by hand, check the tag exists and its release was published."
            exit 1
          fi
          gh release upload "v${VERSION}" \
            "eve-frontend-${VERSION}-dist.tar.gz" \
            --clobber
          echo "Attached eve-frontend-${VERSION}-dist.tar.gz to v${VERSION}"

  publish:
    name: Publish to S3
    runs-on: ubuntu-latest
    needs: release-build
    environment: esa-eve-staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          ASSET_NAME="eve-frontend-${VERSION}-dist.tar.gz"

          echo "Downloading asset: ${ASSET_NAME}"
          gh release download "v${VERSION}" \
            -p "${ASSET_NAME}" \
            -D .

          tar xzf "${ASSET_NAME}"
          ls -la dist/

      # The release stage: one build is promoted unchanged across environments, so anything
      # that differs between them is combined with the artifact here rather than baked in.
      # An undefined variable expands to the empty string, which the app treats as absent and
      # falls back to the code's default -- it does not read as "off".
      - name: Inject runtime config
        uses: ./.github/actions/inject-runtime-config
        with:
          config-json: |
            {
              "FEATURE_MODEL_PICKER": "${{ vars.FEATURE_MODEL_PICKER }}",
              "FEATURE_CUSTOM_MODELS": "${{ vars.FEATURE_CUSTOM_MODELS }}",
              "FEATURE_STREAMING": "${{ vars.FEATURE_STREAMING }}",
              "FEATURE_CLASSIFICATION_FILTERS": "${{ vars.FEATURE_CLASSIFICATION_FILTERS }}",
              "FEATURE_SELF_SIGNUP": "${{ vars.FEATURE_SELF_SIGNUP }}",
              "CONTACT_URL": "${{ vars.VITE_CONTACT_URL }}",
              "PRIVACY_POLICY_URL": "${{ vars.VITE_PRIVACY_POLICY_URL }}",
              "ABOUT_US_URL": "${{ vars.VITE_ABOUT_US_URL }}"
            }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload to S3
        run: |
          COMMIT_SHA="${{ needs.release-build.outputs.commit-sha }}"
          RELEASE_PATH="releases/${COMMIT_SHA}"

          echo "Uploading to s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"
          aws s3 cp --recursive dist/ "s3://${{ vars.FRONTEND_BUCKET }}/${RELEASE_PATH}/"

          echo "Upload complete"

      # Same job as the upload on purpose: an Environment gate fires once per job, so promoting to
      # production used to ask the reviewer to approve the same decision twice.
      - name: Flip release pointer
        uses: ./.github/actions/flip-release
        with:
          release-sha: ${{ needs.release-build.outputs.commit-sha }}
          public-url: ${{ vars.PUBLIC_URL }}
          kvs-arn: ${{ vars.RELEASE_KVS_ARN }}
